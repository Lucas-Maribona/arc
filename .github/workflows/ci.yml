name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --all-targets
      - run: cargo clippy --locked --all-targets -- -D warnings

  minimum-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - run: cargo check --locked --all-targets

  static-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update
      - run: sudo apt-get install --yes musl-tools
      - run: cargo build --locked --release --target x86_64-unknown-linux-musl
      - run: "! readelf -l target/x86_64-unknown-linux-musl/release/arc | grep -q 'Requesting program interpreter'"
      - uses: actions/upload-artifact@v4
        with:
          name: arc-x86_64-linux-static
          path: target/x86_64-unknown-linux-musl/release/arc
